services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # gRPC 수신 포트
      - "4318:4318"   # HTTP 수신 포트
      - "8889:8889"   # Prometheus 메트릭 포트
    depends_on:
      - tempo
    networks:
      - otel-network

  # Grafana Tempo
  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP 서버 포트
      - "4317"        # gRPC 수신 포트
    networks:
      - otel-network
    user: "0:0"       # 권한 문제 방지


  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"   # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - tempo
    networks:
      - otel-network

  # User Service
  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      # OpenTelemetry 설정
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=user-service
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_RESOURCE_ATTRIBUTES=service.name=user-service,service.version=1.0.0
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # 서비스 간 통신
      - ORDER_SERVICE_URL=http://order-service:8082
    depends_on:
      - otel-collector
    networks:
      - otel-network

  # Order Service
  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      # OpenTelemetry 설정
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=order-service
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_RESOURCE_ATTRIBUTES=service.name=order-service,service.version=1.0.0
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # 서비스 간 통신
      - PAYMENT_SERVICE_URL=http://payment-service:8083
    depends_on:
      - otel-collector
    networks:
      - otel-network

  # Payment Service
  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      # OpenTelemetry 설정
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=payment-service
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_RESOURCE_ATTRIBUTES=service.name=payment-service,service.version=1.0.0
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - otel-collector
    networks:
      - otel-network

volumes:
  tempo-data:
  grafana-data:

networks:
  otel-network:
    driver: bridge
